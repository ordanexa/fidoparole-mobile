[package]
name = "fidoparole-core"
description = "FidoParole core: vault format and a pure-Rust CTAP2 client (hmac-secret, largeBlob)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[lib]
name = "fidoparole_core"

[dependencies]
aes = "0.9.3"
aes-gcm = "0.11.1"
argon2 = "0.6.0"
cbc = "0.2.1"
ciborium = "0.2.2"
flate2 = "1.1.10"
hkdf = "0.13.0"
hmac = "0.13.0"
p256 = { version = "0.14.0", features = ["ecdh"] }
rand = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
uuid = "1.28.0"
zeroize = { version = "1.9.1", features = ["serde", "derive"] }

[features]
# In-process software authenticator for tests and the cross-check tool.
mock = []

[[example]]
name = "mock_server"
required-features = ["mock"]
